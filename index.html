<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#070B14"/>
<title>Guardias EM · Polygon</title>
<script>
// Tema guardado (claro/oscuro). Sin preferencia guardada se sigue el del sistema.
try{var t=localStorage.getItem('tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06090F;--s1:#0B111C;--s2:#101827;--s3:#172133;--s4:#1F2B40;
  --line:rgba(148,170,200,0.10);--line2:rgba(148,170,200,0.18);--line-hover:rgba(148,170,200,0.32);
  --t1:#EAF0F8;--t2:#A6B5CA;--t3:#7588A3;
  --a:#5AB8FF;--a2:#8B7CFF;--a-ink:#03121F;--a-soft:rgba(90,184,255,0.12);--a-line:rgba(90,184,255,0.38);--a-hover:#86CBFF;
  --ok:#3DDC97;--ok-soft:rgba(61,220,151,0.12);
  --warn:#FFC24B;--warn-soft:rgba(255,194,75,0.13);
  --err:#FF7A7A;--err-soft:rgba(255,122,122,0.12);
  --glow1:rgba(90,184,255,0.14);--glow2:rgba(139,124,255,0.10);
  --topbar:rgba(6,9,15,0.78);--hover:rgba(148,170,200,0.05);--shadow:0 1px 0 rgba(255,255,255,0.03) inset;
  --shadow-lg:0 30px 80px rgba(0,0,0,0.55);--ring:90,184,255;
  --font:'Geist',system-ui,-apple-system,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
  --r:14px;--r-sm:9px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme=dark]){
    --bg:#F4F6FA;--s1:#FFFFFF;--s2:#F3F6FA;--s3:#E7ECF3;--s4:#DAE1EB;
    --line:rgba(15,30,60,0.08);--line2:rgba(15,30,60,0.15);--line-hover:rgba(15,30,60,0.3);
    --t1:#0E1726;--t2:#3B4A63;--t3:#5B6B84;
    --a:#0A6CC2;--a2:#5B4BD6;--a-ink:#FFFFFF;--a-soft:rgba(10,108,194,0.08);--a-line:rgba(10,108,194,0.32);--a-hover:#0858A0;
    --ok:#0B7A52;--ok-soft:rgba(11,122,82,0.09);
    --warn:#9A5800;--warn-soft:rgba(214,130,0,0.12);
    --err:#BE322C;--err-soft:rgba(190,50,44,0.08);
    --glow1:rgba(10,108,194,0.08);--glow2:rgba(91,75,214,0.06);
    --topbar:rgba(244,246,250,0.8);--hover:rgba(15,30,60,0.03);--shadow:0 1px 2px rgba(15,30,60,0.05);
    --shadow-lg:0 30px 80px rgba(15,30,60,0.18);--ring:10,108,194;
    color-scheme:light;
  }
}
:root[data-theme=light]{
  --bg:#F4F6FA;--s1:#FFFFFF;--s2:#F3F6FA;--s3:#E7ECF3;--s4:#DAE1EB;
  --line:rgba(15,30,60,0.08);--line2:rgba(15,30,60,0.15);--line-hover:rgba(15,30,60,0.3);
  --t1:#0E1726;--t2:#3B4A63;--t3:#5B6B84;
  --a:#0A6CC2;--a2:#5B4BD6;--a-ink:#FFFFFF;--a-soft:rgba(10,108,194,0.08);--a-line:rgba(10,108,194,0.32);--a-hover:#0858A0;
  --ok:#0B7A52;--ok-soft:rgba(11,122,82,0.09);
  --warn:#9A5800;--warn-soft:rgba(214,130,0,0.12);
  --err:#BE322C;--err-soft:rgba(190,50,44,0.08);
  --glow1:rgba(10,108,194,0.08);--glow2:rgba(91,75,214,0.06);
  --topbar:rgba(244,246,250,0.8);--hover:rgba(15,30,60,0.03);--shadow:0 1px 2px rgba(15,30,60,0.05);
  --shadow-lg:0 30px 80px rgba(15,30,60,0.18);--ring:10,108,194;
  color-scheme:light;
}

html,body{min-height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
body{background-image:radial-gradient(900px 420px at 15% -8%,var(--glow1),transparent 70%),radial-gradient(800px 380px at 95% -10%,var(--glow2),transparent 70%);background-repeat:no-repeat}
#app{min-height:100vh}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:6px;border:3px solid var(--bg)}
::selection{background:var(--a-soft)}
.mono{font-family:var(--mono);font-feature-settings:"zero"}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── Controles ─────────────────────────────── */
label,.lbl{display:block;margin-bottom:6px;font-size:12px;font-weight:500;color:var(--t2)}
input,select{width:100%;height:42px;padding:0 13px;font:inherit;font-size:14px;color:var(--t1);background:var(--s1);border:1px solid var(--line2);border-radius:var(--r-sm);outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--t3)}
input:hover,select:hover{border-color:var(--line-hover)}
input:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--a-soft)}
input[type=date]{font-family:var(--mono);font-size:13px}
.field{min-width:0}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-sm);font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .06s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--a);color:var(--a-ink);font-weight:600}
.btn-primary:hover:not(:disabled){background:var(--a-hover)}
.btn-ghost{color:var(--t2);border:1px solid var(--line2);background:var(--s1)}
.btn-ghost:hover:not(:disabled){color:var(--t1);border-color:var(--line-hover)}
.btn-quiet{color:var(--t2)}
.btn-quiet:hover:not(:disabled){color:var(--t1);background:var(--hover)}
.btn-sm{height:32px;padding:0 11px;font-size:13px}
.btn-block{width:100%}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--t2);transition:color .15s,background .15s}
.icon-btn:hover:not(:disabled){color:var(--t1);background:var(--hover)}
.icon-btn svg{width:18px;height:18px}

/* ── Superficies ───────────────────────────── */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag-ok{color:var(--ok);background:var(--ok-soft)}
.tag-warn{color:var(--warn);background:var(--warn-soft)}
.tag-err{color:var(--err);background:var(--err-soft)}
.tag-live{color:var(--a);background:var(--a-soft)}
.tag-live::before{animation:ping 1.8s infinite}
.tag-plain{color:var(--t2);background:var(--s3)}
.tag-plain::before{display:none}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--a);background:var(--a-soft);border:1px solid var(--a-line)}
.avatar.lg{width:42px;height:42px;font-size:14px}
.avatar.off{color:var(--t3);background:var(--s3);border-color:var(--line2)}

/* ── Barra superior ────────────────────────── */
.topbar{position:sticky;top:0;z-index:50;background:var(--topbar);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;height:62px;padding:0 24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 4px 14px rgba(var(--ring),.3)}
.logo svg{width:17px;height:17px}
.brand-t{font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.15}
.brand-s{font-size:12px;color:var(--t3);line-height:1.15}
.nav{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--s2);border:1px solid var(--line)}
.nav button{height:32px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--t3);display:inline-flex;align-items:center;gap:7px;transition:color .15s,background .15s}
.nav button svg{width:15px;height:15px}
.nav button:hover{color:var(--t1)}
.nav button[aria-current=page]{color:var(--t1);background:var(--s1);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px var(--line)}
.top-right{display:flex;justify-content:flex-end;align-items:center;gap:4px}
.clock{font-family:var(--mono);font-size:13px;color:var(--t3);padding:0 10px;white-space:nowrap}

/* ── Página ────────────────────────────────── */
.page{max-width:1240px;margin:0 auto;padding:30px 24px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.h1{font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.sub{color:var(--t3);font-size:14px;margin-top:4px}

/* Selector de modo */
.modes{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--s2);border:1px solid var(--line)}
.modes button{height:34px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--t3);display:inline-flex;align-items:center;gap:7px}
.modes button svg{width:15px;height:15px}
.modes button:hover{color:var(--t1)}
.modes button[aria-pressed=true]{color:var(--t1);background:var(--s1);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px var(--line)}

/* ── Hero de guardia ───────────────────────── */
.hero{position:relative;overflow:hidden;padding:26px 28px 24px}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(600px 220px at 0% 0%,var(--glow1),transparent 70%),radial-gradient(500px 200px at 100% 0%,var(--glow2),transparent 70%)}
.hero>*{position:relative}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero-title{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-top:10px}
.hero-range{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;color:var(--t2);font-size:14px}
.hero-range .mono{font-size:13.5px}
.hero-range .arrow{color:var(--t3)}
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stepper .icon-btn{border:1px solid var(--line2);background:var(--s1)}
.date-jump{width:auto;height:36px;padding:0 10px}
.back-now{font-size:13px;color:var(--a);font-weight:500;height:36px;padding:0 6px}
.back-now:hover{text-decoration:underline}

/* Línea de tiempo */
.tl{margin-top:26px}
.tl-track{position:relative;height:46px;margin:0 6px}
.tl-bar{position:absolute;left:0;right:0;top:18px;height:10px;border-radius:6px;background:var(--s3);overflow:hidden}
.tl-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--a-soft),rgba(var(--ring),.28));border-radius:6px}
.tl-tick{position:absolute;top:0;bottom:0;width:1px}
.tl-tick i{position:absolute;top:30px;left:0;height:6px;width:1px;background:var(--line2)}
.tl-tick span{position:absolute;top:34px;left:0;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--t3);white-space:nowrap}
.tl-tick.first span{transform:none}
.tl-tick.last span{transform:translateX(-100%)}
.tl-dot{position:absolute;top:13px;width:20px;height:20px;margin-left:-10px;border-radius:50%;border:3px solid var(--s1);box-shadow:0 0 0 1px var(--line2);transition:transform .15s}
.tl-dot:hover{transform:scale(1.25);z-index:2}
.tl-dot.ok{background:var(--ok)}
.tl-dot.pend{background:var(--warn)}
.tl-now{position:absolute;top:6px;bottom:10px;width:2px;margin-left:-1px;background:var(--a);border-radius:2px}
.tl-now::before{content:"AHORA";position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--a)}
.tl-legend{display:flex;gap:16px;margin-top:22px;font-size:12px;color:var(--t3)}
.tl-legend span{display:inline-flex;align-items:center;gap:6px}
.tl-legend i{width:8px;height:8px;border-radius:50%}

/* Rango libre */
.range-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:18px}
.range-row .field{width:180px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--t2);border:1px solid var(--line2);background:var(--s1)}
.chip:hover{color:var(--t1);border-color:var(--line-hover)}
.days{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:22px}
.days div{flex:1;min-width:3px;border-radius:3px 3px 1px 1px;background:var(--a);opacity:.75;transition:opacity .15s}
.days div.zero{background:var(--s3);opacity:1}
.days div:hover{opacity:1}
.days-axis{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--t3)}

/* ── KPIs ──────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 26px}
.kpi{padding:16px 18px}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-l{font-size:13px;color:var(--t3);font-weight:500}
.kpi-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.kpi-ic svg{width:15px;height:15px}
.kpi-v{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.ring{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--s3) 0)}
.ring::after{content:"";display:block;width:18px;height:18px;margin:5px;border-radius:50%;background:var(--s1)}

/* ── Barra de herramientas ─────────────────── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px;max-width:380px}
.search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.search input{padding-left:36px;height:38px}
.filters{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--s2);border:1px solid var(--line)}
.filters button{height:30px;padding:0 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--t3);display:inline-flex;align-items:center;gap:6px}
.filters button b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--t3)}
.filters button:hover{color:var(--t1)}
.filters button[aria-pressed=true]{color:var(--t1);background:var(--s1);box-shadow:0 0 0 1px var(--line)}
.toolbar .spacer{flex:1}
.views{display:inline-flex;gap:2px}
.views .icon-btn[aria-pressed=true]{color:var(--a);background:var(--a-soft)}

/* ── Avisos (tarjetas) ─────────────────────── */
.feed{display:flex;flex-direction:column;gap:10px}
.av{display:grid;grid-template-columns:88px 1fr;gap:0;overflow:hidden;scroll-margin-top:90px;transition:border-color .2s,box-shadow .2s}
.av:hover{border-color:var(--line2)}
.av.flash{border-color:var(--a);box-shadow:0 0 0 3px var(--a-soft)}
.av-time{padding:18px 0 18px 18px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);position:relative}
.av-time::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
.av.ok .av-time::before{background:var(--ok)}
.av-h{font-family:var(--mono);font-size:19px;font-weight:500;letter-spacing:-.02em}
.av-d{font-size:12px;color:var(--t3);text-transform:capitalize}
.av-body{padding:16px 20px 16px;min-width:0}
.av-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.av-svc{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.35;word-break:break-word}
.av-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}
.av-sec .eyebrow{margin-bottom:4px;font-size:10.5px}
.av-sec p{font-size:14px;color:var(--t2);white-space:pre-wrap;word-break:break-word}
.av-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2);font-size:13px;color:var(--t3);flex-wrap:wrap}
.who{display:flex;align-items:center;gap:9px;color:var(--t2);font-weight:500}
.who .avatar{width:26px;height:26px;font-size:10px}
mark{background:rgba(var(--ring),.22);color:inherit;border-radius:3px;padding:0 1px}

/* ── Tabla ─────────────────────────────────── */
.table-wrap{overflow:auto;max-height:72vh}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{position:sticky;top:0;z-index:1;padding:11px 16px;text-align:left;font-size:12px;font-weight:500;color:var(--t3);background:var(--s2);border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--hover)}
td.m{font-family:var(--mono);font-size:13px;color:var(--t2);white-space:nowrap}
td.wide{min-width:220px;max-width:360px;font-size:13.5px;color:var(--t2);white-space:pre-wrap;word-break:break-word}
td.nw{white-space:nowrap}
.dash{color:var(--t3)}

/* ── Técnicos ──────────────────────────────── */
.tec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tec{padding:18px;display:flex;flex-direction:column;gap:14px}
.tec.off{opacity:.62}
.tec-top{display:flex;align-items:center;gap:12px;min-width:0}
.tec-name{font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.3}
.tec-mail{font-family:var(--mono);font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tec-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.tec-meta dt{color:var(--t3)}
.tec-meta dd{color:var(--t2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tec-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.switch{position:relative;width:40px;height:22px;border-radius:999px;background:var(--s4);transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked=true]{background:var(--ok)}
.switch[aria-checked=true]::after{transform:translateX(18px)}

/* ── Estados ───────────────────────────────── */
.empty{padding:56px 24px;text-align:center;color:var(--t3)}
.empty-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;margin:0 auto 14px;background:var(--s2);border:1px solid var(--line)}
.empty-ic svg{width:22px;height:22px}
.empty b{display:block;color:var(--t1);font-weight:600;font-size:15px;margin-bottom:3px}
.skel{border-radius:var(--r);height:132px;background:linear-gradient(90deg,var(--s1) 0%,var(--s2) 50%,var(--s1) 100%);background-size:200% 100%;animation:shimmer 1.2s infinite;border:1px solid var(--line)}
.note{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-sm);font-size:14px}
.note-err{color:var(--err);background:var(--err-soft)}

// ── FECHAS (siempre en hora local, no UTC) ──────────────────────
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var r=new Date(d.getFullYear(),d.getMonth(),d.getDate());r.setDate(r.getDate()+n);return r}
function atHour(d,h){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,0,0,0)}
function hhmm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function dShort(d){return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}).replace(',','')}
function dNum(d){return d.toLocaleDateString('es-ES')}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function clockText(){var n=new Date();return dShort(n)+' · '+hhmm(n)}

// ── GUARDIAS ────────────────────────────────────────────────────
// Cada día empieza exactamente una guardia:
//   lunes–viernes 20:00 → 07:00 del día siguiente
//   sábado y domingo 07:00 → 07:00 del día siguiente
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado']
function shiftFor(dayYmd) {
  var d=parseYmd(dayYmd), dow=d.getDay(), weekend=(dow===0||dow===6)
  var start=atHour(d,weekend?7:20), end=atHour(addDays(d,1),7)
  return {
    day:dayYmd, start:start, end:end, weekend:weekend,
    title: weekend ? 'Guardia de '+DIAS[dow] : 'Noche del '+DIAS[dow],
    kind: weekend ? '24 horas' : 'Nocturna',
    hours: Math.round((end-start)/36e5)
  }
}
// Guardia "actual": la que está en curso o, si no hay ninguna, la última que terminó.
// Ej.: jueves 10:00 → noche del miércoles (mié 20:00 → jue 07:00).
function currentShiftDay(now) {
  now=now||new Date()
  for(var i=0;i<3;i++){var day=ymd(addDays(now,-i));if(shiftFor(day).start<=now)return day}
  return ymd(addDays(now,-1))
}
function shiftState(s){var n=new Date();return n<s.start?'future':(n<s.end?'live':'done')}

function fmtVal(key, val) {

}

// ── DOM HELPERS ─────────────────────────────────────────────────
function h(tag, attrs) {
  var el = document.createElement(tag)
  attrs = attrs||{}
  for(var k in attrs) {
    var v = attrs[k]
    if(v===undefined||v===null||v===false) continue
    if(k==='style'&&typeof v==='object') Object.assign(el.style,v)
    else if(k==='className') el.className=v
    else if(k.slice(0,2)==='on'&&typeof v==='function') el[k]=v
    else if(k==='disabled') el.disabled=v
    else if(k==='value') el.value=v
    else el.setAttribute(k,v===true?'':v)
  }
  for(var i=2;i<arguments.length;i++) append(el,arguments[i])
  return el
}
function append(el,c){
  if(c==null||c===false||c==='') return
  if(Array.isArray(c)) c.forEach(function(x){append(el,x)})
  else el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c)
}
function div(a){var args=[].slice.call(arguments);args.unshift('div');return h.apply(null,args)}
function span(a){var args=[].slice.call(arguments);args.unshift('span');return h.apply(null,args)}
function btn(a){var args=[].slice.call(arguments);args.unshift('button');return h.apply(null,args)}
function inp(a){return h('input',a)}

function field(labelText, control) {
  if(!control.id) control.id='f'+Math.random().toString(36).slice(2,8)
  return div({className:'field'},h('label',{for:control.id},labelText),control)
}
function pBtn(text,onClick,disabled,cls,ic) {

function gBtn(text,onClick,disabled,cls,ic) {

}

}
function tag(text,kind){return span({className:'tag tag-'+kind},text)}
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(p){return p[0]}).join('').toUpperCase()}
function empty(ic,title,desc){return div({className:'empty'},div({className:'empty-ic'},icon(ic)),h('b',{},title),desc||'')}
function relTime(iso) {
  if(!iso) return null
  var d=new Date(iso), mins=Math.round((Date.now()-d.getTime())/60000)
  if(isNaN(mins)) return null
  if(mins<1) return 'ahora mismo'
  if(mins<60) return 'hace '+mins+' min'
  if(mins<1440) return 'hace '+Math.round(mins/60)+' h'
  if(mins<10080) return 'hace '+Math.round(mins/1440)+' d'
  return d.toLocaleDateString('es-ES')
}
// Resalta el texto buscado sin usar innerHTML con datos de la BD
function hl(text,q){
  text=String(text==null?'':text)
  if(!q) return text
  var out=[],low=text.toLowerCase(),ql=q.toLowerCase(),i=0,j
  while((j=low.indexOf(ql,i))>=0){out.push(text.slice(i,j));out.push(h('mark',{},text.slice(j,j+q.length)));i=j+q.length}
  out.push(text.slice(i))
  return out
}

function avisoDate(a){return new Date(a.fecha_aviso+'T'+String(a.hora_aviso||'00:00').slice(0,5)+':00')}
function query() {
  if(state.mode==='guardia') {
    var s=shiftFor(state.shiftDay)
    return {key:'g'+state.shiftDay,fromDay:ymd(s.start),toDay:ymd(s.end),start:s.start,end:s.end,
            label:s.title+' '+dNum(s.start)+' ('+hhmm(s.start)+' - '+hhmm(s.end)+')'}
  }
  return {key:'r'+state.dateFrom+state.dateTo,fromDay:state.dateFrom,toDay:state.dateTo,
          label:dNum(parseYmd(state.dateFrom))+' - '+dNum(parseYmd(state.dateTo)),
          bad:!state.dateFrom||!state.dateTo||state.dateFrom>state.dateTo}
}
var loadSeq=0
function loadAvisos() {
  var q=query(), seq=++loadSeq
  if(q.bad) return
  setState({loading:true,loadErr:'',loadedKey:q.key})
  window.db.from('avisos').select('*').gte('fecha_aviso',q.fromDay).lte('fecha_aviso',q.toDay).order('fecha_aviso').order('hora_aviso').then(function(res){
    if(seq!==loadSeq) return
    var rows=res.data||[]
    // En modo guardia se filtra por fecha Y hora (p. ej. 20:00 → 07:00), no por días completos
    if(q.start) rows=rows.filter(function(a){var t=avisoDate(a);return t>=q.start&&t<q.end})
    if(res.error) console.error('Error:',res.error)
    setState({avisos:rows,loading:false,loadErr:res.error?res.error.message:''})
  })
}
function visibleAvisos() {
  var q=state.q.trim().toLowerCase()
  return state.avisos.filter(function(a){
    if(state.status==='pend'&&a.solucionado) return false
    if(state.status==='ok'&&!a.solucionado) return false
    if(!q) return true
    return [a.servicio,a.averia,a.acciones,a.tecnico_nombre].some(function(v){return String(v||'').toLowerCase().indexOf(q)>=0})
  })
}
function goShift(day){setState({mode:'guardia',shiftDay:day,q:'',status:'all'})}

function renderShiftHero(av) {

  var stepper=div({className:'stepper'},

    iconBtn('right','Guardia siguiente',function(){goShift(ymd(addDays(parseYmd(state.shiftDay),1)))},{disabled:shiftFor(ymd(addDays(parseYmd(state.shiftDay),1))).start>new Date()}),
    jump,

  )
  return div({className:'card hero'},

function renderTimeline(s,st,av) {
  var span_=s.end-s.start, step=s.hours>12?3:2
  var track=div({className:'tl-track'})
  var bar=div({className:'tl-bar'})
  if(st!=='future') bar.appendChild(div({className:'tl-fill',style:{width:(st==='live'?Math.min(100,(Date.now()-s.start)/span_*100):100)+'%'}}))
  track.appendChild(bar)
  // Marcas cada 2 h (noche) o 3 h (24 h), más la hora final (07:00) siempre
  var marks=[];for(var hh=0;hh<s.hours-1;hh+=step)marks.push(hh);marks.push(s.hours)
  marks.forEach(function(hh,i){
    var t=new Date(s.start.getTime()+hh*36e5)
    track.appendChild(div({className:'tl-tick'+(i===0?' first':'')+(i===marks.length-1?' last':(i%2?' odd':'')),style:{left:(hh*36e5/span_*100)+'%'}},h('i'),span({},hhmm(t))))
  })
  if(st==='live') track.appendChild(div({className:'tl-now',style:{left:((Date.now()-s.start)/span_*100)+'%'}}))
  av.forEach(function(a){
    var p=Math.max(0,Math.min(100,(avisoDate(a)-s.start)/span_*100))
    track.appendChild(btn({type:'button',className:'tl-dot '+(a.solucionado?'ok':'pend'),style:{left:p+'%'},
      title:hhmm(avisoDate(a))+' · '+(a.servicio||'')+(a.solucionado?' · resuelto':' · pendiente'),
      'aria-label':'Aviso de las '+hhmm(avisoDate(a))+' en '+(a.servicio||''),
      onclick:function(){focusAviso(a.id)}}))
  })
  return div({className:'tl'},track,
    div({className:'tl-legend'},
      span({},h('i',{style:{background:'var(--warn)'}}),'Pendiente'),
      span({},h('i',{style:{background:'var(--ok)'}}),'Resuelto'),
      av.length?span({},'Pulsa un punto para ir al aviso'):span({},'Sin avisos en esta guardia')))
}
function focusAviso(id){
  if(state.view!=='cards'||state.q||state.status!=='all') setState({view:'cards',q:'',status:'all'})
  var el=document.getElementById('av-'+id)
  if(!el) return
  el.scrollIntoView({behavior:'smooth',block:'center'})
  el.classList.add('flash');setTimeout(function(){el.classList.remove('flash')},1400)

function renderRangeHero(q,av) {
  var presets=[['Hoy',0],['7 días',6],['30 días',29]]
  var setRange=function(n){setState({dateFrom:ymd(addDays(new Date(),-n)),dateTo:TODAY})}
  var thisMonth=function(){var n=new Date();setState({dateFrom:ymd(new Date(n.getFullYear(),n.getMonth(),1)),dateTo:TODAY})}
  var row=div({className:'range-row'},
    field('Desde',inp({type:'date',value:state.dateFrom,onchange:function(e){setState({dateFrom:e.target.value})}})),
    field('Hasta',inp({type:'date',value:state.dateTo,onchange:function(e){setState({dateTo:e.target.value})}})),

  return div({className:'card hero'},

function renderDays(av) {
  var from=parseYmd(state.dateFrom), to=parseYmd(state.dateTo)
  var n=Math.round((to-from)/864e5)+1
  if(n<2||n>92) return null
  var counts={};av.forEach(function(a){counts[a.fecha_aviso]=(counts[a.fecha_aviso]||0)+1})
  var max=Math.max.apply(null,[1].concat(Object.keys(counts).map(function(k){return counts[k]})))
  var bars=div({className:'days','aria-hidden':'true'})
  for(var i=0;i<n;i++){
    var d=addDays(from,i), c=counts[ymd(d)]||0
    bars.appendChild(div({className:c?'':'zero',style:{height:(c?Math.max(10,c/max*100):6)+'%'},title:dShort(d)+': '+c+(c===1?' aviso':' avisos')}))
  }
  return div({},bars,div({className:'days-axis'},span({},dShort(from)),span({},dShort(to))))
}

function loadTecnicos() {
  window.db.from('tecnicos').select('*').order('nombre').then(function(r){
    if(r.error) setState({tecLoaded:true,tecErr:r.error.message})
    else setState({tecLoaded:true,tecErr:'',tecnicos:r.data||[]})
  })

function addTecnico() {
  var f=state.tecForm
  if(!f.nombre.trim()||!f.email.trim()||!f.password){setState({modalErr:'Rellena nombre, email y contraseña'});return}
  crypto.subtle.digest('SHA-256',new TextEncoder().encode(f.password)).then(function(bytes){
    var hash=Array.from(new Uint8Array(bytes)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')
    window.db.from('tecnicos').insert({nombre:f.nombre.trim(),email:f.email.trim().toLowerCase(),password_hash:hash}).then(function(r){
      if(r.error){setState({modalErr:'Error: '+r.error.message});return}
      state.tecForm={nombre:'',email:'',password:''}
      closeModal();showToast('Técnico creado');loadTecnicos()
    })
  })
}
function toggleTecnico(t) {
  window.db.from('tecnicos').update({activo:!t.activo}).eq('id',t.id).then(function(r){
    if(r.error) showToast('Error: '+r.error.message,true)
    else showToast(t.nombre+(t.activo?' desactivado':' activado'))
    loadTecnicos()
  })
}

  else body=div({className:'tec-grid'},state.tecnicos.map(function(t){
    var rel=relTime(t.ultimo_acceso)
    return div({className:'card tec'+(t.activo?'':' off')},

    div({className:'brand'},div({className:'logo'},icon('pulse')),div({},div({className:'brand-t'},'Guardias EM'),div({className:'brand-s'},'Polygon · Electromedicina'))),
    h('nav',{className:'nav','aria-label':'Secciones'},tabs.map(function(t){
      return btn({type:'button','aria-label':t[1],'aria-current':state.tab===t[0]?'page':null,onclick:function(){setState({tab:t[0]})}},icon(t[2]),span({},t[1]))
    })),
    div({className:'top-right'},
      span({className:'clock',id:'clock'},clockText()),
      themeBtn(),
      iconBtn('out','Salir',function(){sessionStorage.removeItem('ga');setState({page:'login'})}))
  ))
  var content=h('main',{className:'page'},state.tab==='tecnicos'?renderTecnicos():renderRegistros())
  return div({},header,content)
}

function render() {
  var app=document.getElementById('app')
  if(!app)return
  // Conservar foco, cursor y scroll al repintar (p. ej. al escribir en el buscador)
  var ae=document.activeElement, fid=ae&&ae.id, sel=null, sy=window.scrollY
  try{if(fid&&typeof ae.selectionStart==='number')sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}
  if(!state.modal) state._modalOpened=false
  app.innerHTML=''
  if(!window.db){app.appendChild(div({className:'boot'},'Conectando…'));return}
  if(state.page==='login') app.appendChild(renderLogin())
  else {
    app.appendChild(renderMain())
    if(state.modal==='export') app.appendChild(renderExportModal())
    if(state.modal==='tecnico') app.appendChild(renderTecnicoModal())
  }
  if(state.toast) app.appendChild(div({className:'toast '+(state.toast.err?'err':'ok'),role:'status'},icon(state.toast.err?'alert':'check'),state.toast.msg))
  window.scrollTo(0,sy)
  if(fid){var el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(sel)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
</script>
</body>
</html>
